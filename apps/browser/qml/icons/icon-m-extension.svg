<?xml version="1.0" encoding="UTF-8"?>
<!--
  Atlantic Browser — "extension" glyph, drawn to the Sailfish icon-m convention.

  There is no icon-m-extension in sailfish-default, so this one is ours. It is
  measured against the shipped theme icons rather than guessed: on the 112x112
  canvas an icon-m glyph sits inside a ~14px margin and is stroked at 3px in
  pure white on transparency (icon-m-about, -clock, -ambience all measure 3;
  -mail 4). Silica's Icon colorizes any non-theme source with the ambience
  primary colour, so white-on-transparent tints exactly like a theme icon.

  Kept as SVG rather than a PNG per z-factor: libqsvg is present on the device
  and one file then renders crisply at every Theme.iconSize*.

  This Source Code Form is subject to the terms of the Mozilla Public
  License, v. 2.0. If a copy of the MPL was not distributed with this file,
  You can obtain one at http://mozilla.org/MPL/2.0/.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 112 112">
  <!-- A single puzzle piece: tab on the top edge, socket cut into the right. -->
  <path d="M 14 27
           L 43 27
           A 13 13 0 0 1 69 27
           L 98 27
           L 98 49.5
           A 13 13 0 0 0 98 75.5
           L 98 98
           L 14 98
           Z"
        fill="none" stroke="#ffffff" stroke-width="3"
        stroke-linejoin="miter" stroke-linecap="butt"/>
</svg>
